[build-system]
requires = ["setuptools>=64", "wheel", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-keypad-server"
version = "0.1.0"
description = "Server SDK for secure-keypad: renders per-session shuffled keypads and decrypts tap coordinates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "secure-keypad contributors" }]
keywords = ["secure keypad", "virtual keyboard", "e2e encryption", "libsodium"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cffi>=1.15"]

[project.optional-dependencies]
test = ["pytest>=7", "PyNaCl>=1.5"]

[project.urls]
Homepage = "https://github.com/secure-keypad/secure-keypad"

[tool.setuptools]
packages = ["secure_keypad_server"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
