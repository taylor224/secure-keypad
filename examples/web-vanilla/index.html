<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>차돌이뱅크 · 이체 (secure-keypad 데모)</title>
  <link rel="stylesheet" href="bank.css">
</head>
<body>
  <div class="demostrip">
    <span><b>secure-keypad</b> 데모 — 차돌이뱅크는 실제 은행이 아닙니다.</span>
    <a href="https://github.com/taylor224/secure-keypad" target="_blank" rel="noopener">프로젝트 저장소</a>
  </div>
  <nav class="topnav" data-page="web"></nav>

  <div class="phone">
    <div class="scroll">
      <form class="card" id="login" autocomplete="off">
        <h2>이체하기</h2>
        <label class="field"><span class="lab">받는 분</span>
          <input class="text" type="text" value="츄르마켓 3333-01-1234567" readonly aria-label="받는 분">
        </label>
        <label class="field"><span class="lab">보낼 금액</span>
          <span class="amount"><input class="text" id="amount" type="text" inputmode="numeric" value="50,000" aria-label="보낼 금액"><span class="won">원</span></span>
        </label>
        <label class="field"><span class="lab">출금 비밀번호 (숫자 4자리)</span>
          <input class="text secret" id="pin" type="password" placeholder="••••" aria-label="출금 비밀번호">
        </label>
        <label class="field"><span class="lab">인증서 비밀번호 (영문·한글·숫자)</span>
          <input class="text secret" id="password" type="password" placeholder="••••••••" aria-label="인증서 비밀번호">
        </label>
        <div class="hintline" id="hint">입력창을 누르면 이 기기 전용으로 만들어진 보안 키패드가 열립니다.</div>
        <button class="primary" type="submit">이체하기</button>
        <div class="status" id="status" role="status"></div>
        <div id="result"></div>
      </form>

      <details class="card settings" open>
        <summary>데모 설정 <span class="sub">— 바꾸면 새 세션으로 다시 열립니다</span></summary>
        <div class="setgrid">
          <label>키 배열
            <select id="layout">
              <option value="shuffle">shuffle (기본)</option>
              <option value="full">full (전체 섞기)</option>
              <option value="fixed">fixed (표준 배열 · 경고)</option>
            </select>
          </label>
          <label>키패드 스타일
            <select id="style">
              <option value="auto">auto (기기에 맞춤)</option>
              <option value="ios">iOS</option>
              <option value="material">Material</option>
            </select>
          </label>
          <label>키보드 언어
            <select id="langs">
              <option value="en,ko">영어 + 한국어</option>
              <option value="ko,en">한국어 + 영어</option>
              <option value="en">영어만</option>
              <option value="ko">한국어만</option>
            </select>
          </label>
        </div>
        <div class="setnote" id="settings-status" aria-live="polite"></div>
      </details>

      <div class="card explain">
        <h2>이 화면에서 일어나는 일</h2>
        <ol>
          <li>서버가 이 세션만의 키 배열을 만들어 글자 <em>이미지</em>와 키 사각형만 암호화해 내려줍니다.</li>
          <li>비밀번호는 <b>좌표로만</b> 기록되고, 입력창에는 • 만 남습니다.</li>
          <li>이체하기를 누르면 좌표가 암호화되어 서버로 가고, 서버 SDK가 값을 복원한 뒤 세션을 파기합니다.</li>
        </ol>
      </div>
    </div>
  </div>

  <script src="dist/secure-keypad.iife.js"></script>
  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="settings.js"></script>
  <script src="nav.js"></script>
  <script src="bank.js"></script>
  <script>
    SkpSettings.preselect({ layout: "layout", style: "style", langs: "langs" });
    SkpBank.start();
  </script>
</body>
</html>
