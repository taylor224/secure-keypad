<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>secure-keypad demo</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f3f7; color: #1b1f27; }
    @media (prefers-color-scheme: dark) { body { background: #121419; color: #e7e9ef; } .card { background: #1a1d24; } input { background: #22262f; color: #e7e9ef; border-color: #3c4250; } }
    main { max-width: 420px; margin: 0 auto; padding: 24px 16px 320px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: #6f7683; font-size: 14px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input { width: 100%; box-sizing: border-box; font-size: 20px; letter-spacing: 6px; padding: 12px 14px; border: 1px solid #c3c7d1; border-radius: 8px; }
    input:focus { outline: 2px solid #0b6b6e; border-color: transparent; }
    button.primary { margin-top: 20px; width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; background: #0b6b6e; color: #fff; }
    .status { margin-top: 14px; font-size: 14px; min-height: 20px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; }
    .row { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #6f7683; margin-top: 6px; }
    .row select { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>secure-keypad</h1>
    <p class="sub">서버가 만든 무작위 키패드 · 좌표만 암호화 전송 · 브라우저는 입력값을 모릅니다</p>
    <form class="card" id="login" autocomplete="off">
      <label for="pin">PIN (숫자 키패드)</label>
      <input id="pin" type="password" placeholder="••••••" aria-label="PIN">
      <label for="password">비밀번호 (QWERTY)</label>
      <input id="password" type="password" placeholder="••••••••" aria-label="비밀번호">
      <div class="row">
        <span>배열:</span>
        <select id="layout">
          <option value="shuffle">shuffle (기본)</option>
          <option value="full">full</option>
          <option value="fixed">fixed (경고: 좌표로 추론 가능)</option>
        </select>
        <span id="kid"></span>
      </div>
      <button class="primary" type="submit">로그인</button>
      <div class="status" id="status" role="status"></div>
    </form>
  </main>
  <script src="/dist/secure-keypad.iife.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const layoutSel = document.getElementById("layout");
      if (params.get("layout")) layoutSel.value = params.get("layout");
      const status = document.getElementById("status");
      const { publicKey, kid } = await (await fetch("/keypad/public-key")).json();
      document.getElementById("kid").textContent = "kid " + kid;
      const ctx = "demo-" + Math.random().toString(36).slice(2, 10);
      const common = {
        sessionUrl: "/keypad/session",
        relayoutUrl: "/keypad/relayout",
        serverPublicKey: publicKey,
        headers: () => ({ "x-login-ctx": ctx, "x-keypad-layout": layoutSel.value }),
        style: params.get("style") || "auto",
      };
      const pin = SecureKeypad.createSecureKeypad({ ...common, type: "number", maxLen: 6 });
      const password = SecureKeypad.createSecureKeypad({ ...common, type: "qwerty", maxLen: 32 });
      pin.attach(document.getElementById("pin"));
      password.attach(document.getElementById("password"));
      // debugging aid for the E2E suite: layouts hold rects and roles only
      window.__skp = { pin, password, layouts: {}, ctx };
      pin.on("ready", ({ layout }) => (window.__skp.layouts.pin = layout));
      password.on("ready", ({ layout }) => (window.__skp.layouts.password = layout));
      for (const [name, kp] of [["pin", pin], ["password", password]]) {
        kp.on("error", ({ error }) => (status.textContent = name + ": " + error.message));
        kp.on("expire", () => (status.textContent = name + ": 세션 만료 — 다시 입력하세요"));
      }
      layoutSel.addEventListener("change", () => { pin.reset(); password.reset(); });
      document.getElementById("login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = {};
        try {
          if (pin.length) body.pin_enc = JSON.parse(pin.submit());
          if (password.length) body.password_enc = JSON.parse(password.submit());
        } catch (err) {
          status.textContent = err.message;
          return;
        }
        const res = await fetch("/login", { method: "POST", headers: { "content-type": "application/json", "x-login-ctx": ctx }, body: JSON.stringify(body) });
        const json = await res.json();
        status.textContent = JSON.stringify(json);
        window.__skp.lastLogin = json;
        pin.reset(); password.reset();
      });
    })();
  </script>
</body>
</html>
