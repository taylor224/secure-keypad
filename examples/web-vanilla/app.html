<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>차돌이뱅크 앱 · 이체</title>
  <link rel="stylesheet" href="bank.css">
  <style>
    /* full-bleed inside a device frame; the host page draws the status bar over this iframe */
    .phone { max-width: none; }
    .scroll { padding-top: calc(var(--status-h, 0px) + 12px); padding-bottom: 110px; }
    body:before { content: ""; position: fixed; inset: 0 0 auto; height: var(--status-h, 0px); background: var(--bg); z-index: 2147482000; }
    .menu { display: none; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 0 16px 12px; }
    .menu a { color: var(--blue); font-size: 12px; font-weight: 700; padding: 6px 12px; background: #fff; border-radius: 999px; }
    html[data-standalone="1"] .menu { display: flex; }
    html[data-theme="dark"] {
      --bg: #101314; --card: #191d1f; --ink: #f0f2f3; --ink-2: #b7c0c4; --ink-3: #8a949a; --line: #262c2e;
      --blue: #6aa8ff; --teal-card: #1d4a44; --sand: #241f18; --deep: #d7f5f0; --deep-2: #bfe8e4; --deep-3: #8fc7c0;
    }
    html[data-theme="dark"] body { background: #0a0c0d; }
    html[data-theme="dark"] .tabbar { background: #191d1feb; border-top-color: #262c2e; }
    html[data-theme="dark"] .menu a { background: #22282a; color: var(--ink-2); }
    html[data-theme="dark"] .receipt { background: #1d4a44; color: #d7f5f0; }
    html[data-theme="dark"] .receipt .row span:first-child { color: #8fc7c0; }
    html[data-theme="dark"] .receipt code { background: #ffffff1f; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="scroll">
      <nav class="menu" aria-label="데모 메뉴">
        <a href="./">웹뱅킹</a><a href="ios.html">iPhone 시뮬레이션</a><a href="android.html">Pixel 시뮬레이션</a><a href="native.html">SDK 예제</a>
      </nav>

      <div class="app-head">
        <button class="ghost" type="button" id="gear" aria-label="데모 설정 열기">⚙︎ 데모 설정</button>
      </div>

      <form class="card" id="login" autocomplete="off">
        <h2>이체하기</h2>
        <label class="field"><span class="lab">받는 분</span>
          <input class="text" type="text" value="츄르마켓 3333-01-1234567" readonly aria-label="받는 분">
        </label>
        <label class="field"><span class="lab">보낼 금액</span>
          <span class="amount"><input class="text" id="amount" type="text" inputmode="numeric" value="50,000" aria-label="보낼 금액"><span class="won">원</span></span>
        </label>
        <label class="field"><span class="lab">출금 비밀번호 (숫자 4자리)</span>
          <input class="text secret" id="pin" type="password" placeholder="••••" aria-label="출금 비밀번호">
        </label>
        <label class="field"><span class="lab">인증서 비밀번호</span>
          <input class="text secret" id="password" type="password" placeholder="••••••••" aria-label="인증서 비밀번호">
        </label>
        <div class="hintline" id="hint">입력창을 누르면 보안 키패드가 열립니다.</div>
        <button class="primary" type="submit">이체하기</button>
        <div class="status" id="status" role="status"></div>
        <div id="result"></div>
      </form>

      <details class="card settings" id="settings">
        <summary>데모 설정 <span class="sub">— 키패드 배열 · 언어</span></summary>
        <div class="setgrid">
          <label>키 배열
            <select id="layout">
              <option value="shuffle">shuffle (기본)</option>
              <option value="full">full (전체 섞기)</option>
              <option value="fixed">fixed (표준 배열 · 경고)</option>
            </select>
          </label>
          <label>키보드 언어
            <select id="langs">
              <option value="en,ko">영어 + 한국어</option>
              <option value="ko,en">한국어 + 영어</option>
              <option value="en">영어만</option>
              <option value="ko">한국어만</option>
            </select>
          </label>
        </div>
        <div class="setnote" id="settings-status" aria-live="polite"></div>
      </details>
    </div>

    <nav class="tabbar" aria-label="앱 탭">
      <a class="tab active" href="#"><span class="ic">🏠</span>홈</a>
      <a class="tab" href="#"><span class="ic">🎁</span>혜택</a>
      <a class="tab" href="#"><span class="ic">📈</span>투자</a>
      <a class="tab" href="#"><span class="ic">⋯</span>전체</a>
    </nav>
  </div>

  <script src="dist/secure-keypad.iife.js"></script>
  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="settings.js"></script>
  <script src="bank.js"></script>
  <script>
    (() => {
      const qs = SkpDemo.qs;
      const device = qs.get("device") || (/iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : "android");
      const theme = qs.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.device = device;
      document.documentElement.dataset.theme = theme;
      if (qs.get("embedded") !== "1") document.documentElement.dataset.standalone = "1";
      document.documentElement.style.setProperty("--status-h", Number(qs.get("statusH") || 0) + "px");
      const safeBottom = Number(qs.get("safeBottom") || 0);
      document.documentElement.style.setProperty("--safe-bottom", safeBottom + "px");

      SkpSettings.preselect({ layout: "layout", langs: "langs" });
      document.getElementById("gear").addEventListener("click", () => {
        const s = document.getElementById("settings");
        s.open = !s.open;
        if (s.open) s.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      SkpBank.start({
        style: device === "ios" ? "ios" : "material",
        theme,
        popups: qs.get("popups") === "0" ? false : true, // simulations are driven with a mouse
        safeAreaBottom: safeBottom,
        postToParent: true,
      });
    })();
  </script>
</body>
</html>
